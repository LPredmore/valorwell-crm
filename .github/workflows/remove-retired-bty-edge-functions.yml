name: Remove retired BTY Edge Functions

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remove retired BTY functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ahqauomkgflopxgnlndd
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured for this repository."
            exit 2
          fi
          npx --yes supabase@latest functions delete bty-discovery --project-ref "$SUPABASE_PROJECT_REF" --yes
          npx --yes supabase@latest functions delete bty-contact-enrichment --project-ref "$SUPABASE_PROJECT_REF" --yes
          npx --yes supabase@latest functions delete bty-automation-dispatcher --project-ref "$SUPABASE_PROJECT_REF" --yes
          echo "Retired BTY Edge Functions removed."
