name: Remove retired BTY Edge Functions

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Temporary diagnostic run for the already-retired BTY deployment cleanup.
      - name: Remove retired BTY functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ahqauomkgflopxgnlndd
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured for this repository."
            exit 2
          fi

          functions="$(npx --yes supabase@latest functions list --project-ref "$SUPABASE_PROJECT_REF")"
          for fn in bty-discovery bty-contact-enrichment bty-automation-dispatcher; do
            if printf '%s\n' "$functions" | grep -Fq "$fn"; then
              npx --yes supabase@latest functions delete "$fn" --project-ref "$SUPABASE_PROJECT_REF" --yes
            else
              echo "$fn is already absent."
            fi
          done

          echo "Retired BTY Edge Function cleanup completed."
