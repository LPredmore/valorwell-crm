name: Shared schema recovery source gates
on:
  pull_request:
    paths:
      - 'scripts/migration-recovery/**'
      - 'scripts/run-campaign-lifecycle-acceptance.py'
      - 'docs/architecture/2026-10-21-branch-recovery-source-receipt.md'
      - 'docs/architecture/migration-recovery-evidence/20261021-branch-recovery-receipt.json'
      - 'docs/architecture/2026-10-21-0341-preview-verification-and-acceptance.md'
      - 'docs/architecture/migration-recovery-evidence/20261021-0341-branch-followup.json'
      - 'docs/architecture/2026-10-21-independent-recovery-readiness.md'
      - 'docs/architecture/migration-recovery-evidence/20261021-independent-verification.json'
      - 'docs/architecture/migration-recovery-evidence/20261021-local-test-execution.json'
      - 'supabase/tests/20261018_october_security_rollout_readonly.sql'
      - 'supabase/migrations/20261020214527_*.sql'
      - '.github/workflows/schema-recovery-source-gates.yml'
permissions:
  contents: read
jobs:
  source-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test collision, cutover, secret review and release-order rules
        run: python3 -m unittest discover -s scripts/migration-recovery -p 'test_*.py' -v
      - name: Validate sanitized operator branch receipt (offline, not DB acceptance)
        run: python3 scripts/migration-recovery/branch_receipt.py
      - name: Validate updated preview receipt and pinned source contracts (offline)
        run: python3 scripts/migration-recovery/branch_followup.py
      - name: Check capture shell syntax
        run: bash -n scripts/migration-recovery/capture-application-schema-only.sh
      - name: Check private operator entry points (no private inputs)
        run: |
          python3 scripts/migration-recovery/private-local-restore.py --help
          python3 scripts/migration-recovery/isolated-replay.py --help
      - name: Validate CRM inventory (not full-schema replay)
        run: python3 scripts/migration-recovery/recovery.py inventory --repo crm=. --output /tmp/crm-migration-inventory.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crm-source-inventory-not-db-acceptance
          path: /tmp/crm-migration-inventory.json
