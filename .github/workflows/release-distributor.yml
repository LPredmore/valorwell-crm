name: Release Distributor
on:
  pull_request:
    paths:
      - 'supabase/functions/release-distributor/**'
      - 'supabase/migrations/*distribution*'
      - 'supabase/migrations/*release_distributor*'
      - 'supabase/tests/release-distributor.sql'
      - 'scripts/*distributor*'
      - 'n8n/**'
      - '.github/workflows/release-distributor.yml'
permissions:
  contents: read
jobs:
  distributor-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify workflow graph and publishing outcomes
        run: node scripts/test-distributor-workflows.mjs
      - name: Start isolated PostgreSQL
        run: |
          docker run -d --name valorwell-distributor-test -e POSTGRES_HOST_AUTH_METHOD=trust postgres:16.14
          for attempt in $(seq 1 30); do
            if docker exec valorwell-distributor-test pg_isready -U postgres; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify migrations, tenant access, duplicate prevention, and concurrent claims
        run: node scripts/test-release-distributor.mjs
