name: Repair therapist match PR validation

on:
  push:
    branches:
      - agent/therapist-match-crm-operations

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/therapist-match-crm-operations
      - name: Apply deterministic validation fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('src/pages/crm/canonical/TherapistMatchReconciliationPage.tsx')
          content = page.read_text()
          content = content.replace(
              "  const rows = query.data?.rows ?? [];",
              "  const rows = useMemo(() => query.data?.rows ?? [], [query.data?.rows]);",
          )
          page.write_text(content)

          workflow = Path('.github/workflows/validate.yml')
          content = workflow.read_text()
          content = content.replace('node-version: 20', 'node-version: 22')
          content = content.replace(
              '- run: npm ci\n',
              '- run: npm ci --legacy-peer-deps --no-audit --no-fund\n',
          )
          workflow.write_text(content)
          PY
      - name: Commit corrections
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/crm/canonical/TherapistMatchReconciliationPage.tsx .github/workflows/validate.yml
          git commit -m "Fix therapist reconciliation validation"
          git push origin HEAD:agent/therapist-match-crm-operations
